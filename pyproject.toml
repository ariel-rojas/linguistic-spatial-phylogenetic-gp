[project]
name = "gaussian-processes"
version = "0.1.0"
description = "Imputación OV/VO/Sin dominante con un proceso gaussiano espacial y genealógico"
readme = "README.md"
authors = [
    { name = "ariel-rojas" }
]
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.86",
    "folium>=0.20.0",
    "geopandas>=1.2.0",
    "languages-of-the-world>=0.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "threadpoolctl>=3.7.0",
]

[project.scripts]
gaussian-processes = "gaussian_processes.cli:main"

[project.optional-dependencies]
bayesian = [
    "arviz>=1.3.0",
    "numpyro>=0.22.0",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
